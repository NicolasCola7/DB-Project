services:

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Nic0l4sC0l4
      MYSQL_USER: nicolas
      MYSQL_PASSWORD: Nic0l4sC0l4
      MYSQL_DATABASE: BOTSTARTER
    ports:
      - "3307:3306"
    networks:
      - databases
   

  phpmyadmin:
     image: phpmyadmin:latest
     restart: always
     depends_on:
       - mysql
     environment:
       PMA_HOST: mysql
       PMA_PORT: 3306
       PMA_USER: nicolas
       PMA_PASSWORD: Nic0l4sC0l4
     ports:
       - "9876:80"
     networks:
       - databases

  mongodb:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: nicolas
      MONGO_INITDB_ROOT_PASSWORD: Nic0l4sC0l4
    ports:
      - "27018:27017"
    networks:
      - databases
   
  mongo-express:
    image: mongo-express:latest
    restart: always
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: nicolas
      ME_CONFIG_MONGODB_ADMINPASSWORD: Nic0l4sC0l4
      ME_CONFIG_BASICAUTH: false
    ports:
      - "8081:8081"
    networks:
      - databases

networks:
  databases:
    driver: bridge