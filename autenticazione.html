<!DOCTYPE html>

<head>
    <title>Test Authentication & Registration</title>
    <script>
        function toggleFields() {
            const procedure = document.getElementById('procedure').value;
            const allFields = document.querySelectorAll('.procedure-fields');

            // Hide all fields and disable/remove required attributes
            allFields.forEach(field => {
                field.style.display = 'none';
                const inputs = field.querySelectorAll('input');
                inputs.forEach(input => {
                    input.disabled = true; // Disable hidden inputs
                    input.required = false; // Remove required attribute
                });
            });

            // Show selected fields and enable/set required attributes
            const selectedFields = document.getElementById(`${procedure}_fields`);
            if (selectedFields) {
                selectedFields.style.display = 'block';
                const inputs = selectedFields.querySelectorAll('input');
                inputs.forEach(input => {
                    input.disabled = false; // Enable visible inputs
                    input.required = true; // Add required attribute
                });
            }
        }

        // Initialize on page load
        window.onload = function() {
            toggleFields();
        };
    </script>
    <style>
        .procedure-fields { display: none; margin: 10px 0; }
        .field-group { margin: 5px 0; }
        label { display: inline-block; width: 150px; }
    </style>
</head>
